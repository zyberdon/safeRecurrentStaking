
name: Schedule Diagnostic

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduled execution
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Branch: ${{ github.ref }}"
